<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare DNS 解析更新面板</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 22px;
            text-align: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #3182ce;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #4a5568;
        }
        .checkbox-group input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: #f38020; /* Cloudflare 橙色 */
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e06c11;
        }
        button:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .status-box.info {
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            color: #2b6cb0;
            display: block;
        }
        .status-box.success {
            background: #f0fff4;
            border: 1px solid #c6f6d5;
            color: #276749;
            display: block;
        }
        .status-box.error {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #9b2c2c;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloudflare DNS 快速解析</h2>

    <div class="form-group">
        <label>Zone ID</label>
        <input type="text" id="zoneId" value="77afedbdf71ed41dcfb3397303669d26">
    </div>

    <div class="row">
        <div class="form-group" style="flex: 1;">
            <label>邮箱</label>
            <input type="email" id="email" value="tuchongnc@gmail.com">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>API Key (全局密钥)</label>
            <input type="password" id="apiKey" value="c5120987bd5361831b9f8ef1baccff5f153a9">
        </div>
    </div>

    <div class="form-group">
        <label>完整解析域名</label>
        <input type="text" id="domainName" value="bestip.thm.dpdns.org">
    </div>

    <div class="form-group">
        <label>目标 IP 地址</label>
        <input type="text" id="targetIp" placeholder="例如：1.1.1.1 或 8.8.8.8" required>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="proxied">
        <label for="proxied" style="margin-bottom:0; cursor:pointer;">开启 Cloudflare 代理（小橙云，CDN 加速）</label>
    </div>

    <button id="submitBtn" onclick="updateDnsRecord()">确认更新 DNS 解析</button>

    <div id="statusBox" class="status-box"></div>
</div>

<script>
    async function updateDnsRecord() {
        const zoneId = document.getElementById('zoneId').value.trim();
        const email = document.getElementById('email').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const domainName = document.getElementById('domainName').value.trim();
        const targetIp = document.getElementById('targetIp').value.trim();
        const proxied = document.getElementById('proxied').checked;

        const btn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        if (!targetIp) {
            showStatus('请输入目标 IP 地址', 'error');
            return;
        }

        btn.disabled = true;
        showStatus('正在查询已有解析记录...', 'info');

        const headers = {
            'X-Auth-Email': email,
            'X-Auth-Key': apiKey,
            'Content-Type': 'application/json'
        };

        const baseUrl = `https://api.cloudflare.com/client/v4/zones/${zoneId}/dns_records`;

        try {
            // 步骤 1: 查询当前域名的 DNS 记录
            const searchUrl = `${baseUrl}?type=A&name=${encodeURIComponent(domainName)}`;
            const listRes = await fetch(searchUrl, {
                method: 'GET',
                headers: headers
            });

            if (!listRes.ok) {
                const errData = await listRes.json().catch(() => ({}));
                throw new Error(errData.errors?.[0]?.message || `查询记录失败 (HTTP ${listRes.status})`);
            }

            const listData = await listRes.json();
            const records = listData.result || [];

            let updateRes;
            if (records.length > 0) {
                // 步骤 2a: 记录已存在，执行更新 (PUT)
                const recordId = records[0].id;
                showStatus(`已找到记录 [${recordId}]，正在更新 IP 至 ${targetIp}...`, 'info');

                updateRes = await fetch(`${baseUrl}/${recordId}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify({
                        type: 'A',
                        name: domainName,
                        content: targetIp,
                        ttl: 1, // 1 表示自动
                        proxied: proxied
                    })
                });
            } else {
                // 步骤 2b: 记录不存在，创建新记录 (POST)
                showStatus(`未找到记录，正在创建新解析至 ${targetIp}...`, 'info');

                updateRes = await fetch(baseUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        type: 'A',
                        name: domainName,
                        content: targetIp,
                        ttl: 1,
                        proxied: proxied
                    })
                });
            }

            const resultData = await updateRes.json();
            if (resultData.success) {
                showStatus(`✅ 解析成功！\n域名：${domainName}\n解析到：${targetIp}\n代理状态：${proxied ? '已开启(小橙云)' : '仅DNS(灰色云)'}`, 'success');
            } else {
                const errorMsg = resultData.errors?.[0]?.message || '更新操作失败';
                showStatus(`❌ 更新失败: ${errorMsg}`, 'error');
            }

        } catch (err) {
            // 捕获跨域或网络错误
            if (err.message.includes('Failed to fetch') || err.name === 'TypeError') {
                showStatus('⚠️ 请求受阻（通常是浏览器跨域限制 CORS）：\n浏览器出于安全机制不允许网页直接请求 api.cloudflare.com。\n\n解决办法：\n1. 安装 Chrome 插件「Allow CORS」临时调试。\n2. 或者通过 Cloudflare Workers 做一层 5 行代码的中转。', 'error');
            } else {
                showStatus(`❌ 出错: ${err.message}`, 'error');
            }
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(text, type) {
        const box = document.getElementById('statusBox');
        box.className = `status-box ${type}`;
        box.textContent = text;
    }
</script>

</body>
</html>
