<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江西省体育局 - 新闻稿智能撰写助手</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src *;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.header { background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%); color: #fff; padding: 16px 24px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); flex-shrink: 0; }
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; flex: 1; }
.header .subtitle { font-size: 13px; opacity: 0.85; margin-left: 12px; font-weight: 400; }
.settings-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 22px; padding: 4px 8px; border-radius: 4px; opacity: 0.85; transition: opacity 0.2s; line-height: 1; font-family: inherit; }
.settings-btn:hover { opacity: 1; background: rgba(255,255,255,0.15); }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; gap: 20px; flex: 1; width: 100%; min-height: 0; }
.container > div:first-child { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; }
.container > div:last-child { flex: 1; display: flex; flex-direction: column; min-height: 0; }
@media (max-width: 900px) { .container { flex-direction: column; } .container > div:first-child { width: auto; } }

.panel { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.panel-header { padding: 14px 18px; font-size: 14px; font-weight: 600; background: #fafafa; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; user-select: none; flex-shrink: 0; }
.panel-body { padding: 18px; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; transition: border .2s; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #c0392b; }
.form-group textarea { resize: vertical; min-height: 100px; }
.form-group .hint { font-size: 11px; color: #999; margin-top: 3px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; text-decoration: none; }
.btn-primary { background: #c0392b; color: #fff; }
.btn-primary:hover { background: #a93226; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #f0f2f5; color: #555; }
.btn-secondary:hover { background: #e4e6e9; }
.btn-sm { padding: 6px 14px; font-size: 12px; }

.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #eee; border-top-color: #c0392b; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.cursor-blink { display: inline; animation: blink 0.8s step-end infinite; color: #c0392b; font-weight: bold; }
@keyframes blink { 50% { opacity: 0; } }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 24px; background: #333; color: #fff; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }

#mainInput { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; line-height: 1.7; outline: none; resize: none; min-height: 120px; font-family: inherit; transition: border .2s; flex: 1; }
#mainInput:focus { border-color: #c0392b; }

.error-msg { padding: 12px 16px; background: #fff0f0; border: 1px solid #ffd4d4; border-radius: 6px; color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
.error-msg.show { display: block; }

.saved-tag { font-size: 11px; color: #27ae60; margin-left: 6px; opacity: 0; transition: opacity .3s; }
.saved-tag.show { opacity: 1; }

.result-actions { display: flex; gap: 6px; }
.result-content { padding: 18px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; flex: 1; overflow-y: auto; min-height: 0; font-family: "FangSong", "仿宋", serif; line-height: 1.9; font-size: 16pt; color: #222; cursor: text; }
.result-content:focus { outline: none; border-color: #c0392b; }
.result-content .placeholder { color: #bbb; text-align: center; padding: 60px 0; }
.result-content h2 { font-family: "方正小标宋简体", "FZXiaoBiaoSong-B05S", "SimSun", "宋体", serif; font-size: 18pt; text-align: center; line-height: 1.9; font-weight: normal; margin-bottom: 1.9em; }
.result-content p { text-indent: 2em; margin: 0; text-align: justify; }
.result-content .signature { text-indent: 0; text-align: right; margin-top: 1.9em; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 999; }
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 24px; width: 460px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
.modal-box h3 { font-size: 16px; margin-bottom: 16px; }
.modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.divider { text-align: center; font-size: 12px; color: #999; margin: 14px 0; position: relative; }
.divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 38%; height: 1px; background: #e5e7eb; }
.divider::before { left: 0; }
.divider::after { right: 0; }
.picker-box { margin-top: 4px; }
.picker-box .field { margin-bottom: 12px; }
.picker-box .field label { display: block; font-size: 11px; font-weight: 700; color: #6b7280; margin-bottom: 3px; }
.picker-box .field input, .picker-box .field select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; font-family: inherit; }
.picker-box .field input:focus, .picker-box .field select:focus { border-color: #c0392b; }
.picker-box .error { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 8px; display: none; }
.picker-box .divider { text-align: center; font-size: 12px; color: #999; margin: 12px 0; position: relative; }
.picker-box .divider::before, .picker-box .divider::after { content: ""; position: absolute; top: 50%; width: 38%; height: 1px; background: #e5e7eb; }
.picker-box .divider::before { left: 0; }
.picker-box .divider::after { right: 0; }
.picker-box .picker-actions { display: flex; gap: 8px; margin-top: 12px; }
.picker-box .picker-actions .btn { flex: 1; }
.btn-success { background: #27ae60; color: #fff; }
.btn-success:hover { background: #219a52; }
.btn-back { background: #f0f2f5; color: #555; }
.btn-back:hover { background: #e4e6e9; }
</style>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>

<body>

<div class="header">
  <h1>江西省体育局 <span class="subtitle">新闻稿智能撰写助手</span></h1>
  <button class="settings-btn" onclick="openSettings()" title="API 配置">&#9881;</button>
</div>

<div class="container">

  <!-- Left Panel: Input -->
  <div>
    <div class="panel">
      <div class="panel-header">
        <span>📝 撰写新闻稿</span>
      </div>
      <div class="panel-body">
        <textarea id="mainInput" placeholder="请在此输入新闻事实/要点。"></textarea>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
          <div style="font-size:12px;color:#999">
            <span id="charCount">0</span> 字
          </div>
          <button class="btn btn-primary" id="generateBtn" onclick="generate()">
            生成新闻稿
          </button>
        </div>

        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>
  </div>

  <!-- Right Panel: Result -->
  <div>
    <div class="panel">
      <div class="panel-header">
        <span>📄 生成的新闻稿</span>
        <div class="result-actions">
          <button class="btn btn-secondary btn-sm" onclick="exportDoc()">📋 导出Word</button>
          <button class="btn btn-secondary btn-sm" onclick="regenerate()">🔄 重新生成</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="result-content" id="resultContent" contenteditable="true">
          <div class="placeholder">点击「生成新闻稿」开始撰写</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <h3>&#9881; API 配置</h3>
    <div id="manualConfig">
      <div class="form-group">
        <label>API Base URL <span class="hint" style="font-weight:normal">(OpenAI 兼容格式)</span></label>
        <input type="text" id="apiBaseUrl" placeholder="https://api.deepseek.com/v1">
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>模型</label>
        <input type="text" id="apiModel" placeholder="deepseek-chat">
      </div>
      <div class="form-group">
        <label>最大输出 Tokens（含思考过程）</label>
        <input type="number" id="apiMaxTokens" min="256" max="65536" step="256" placeholder="16384">
        <div class="hint" style="font-weight:normal">思考型模型（如 hy4flash-free）的思考 token 也计入这里，建议 16384～32768；留空则自动 16384。</div>
      </div>
    </div>
    <div id="manualActions">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="clearConfig();closeSettings()">清除</button>
        <button class="btn btn-primary" onclick="handleSave()">保存</button>
      </div>
    </div>
    <div class="divider"><span>🤖 从收藏库选择</span></div>
    <div class="picker-box" id="pickerContent"></div>
  </div>
</div>

<script src="prompt.js"></script>
<script src="html-docx.js"></script>
<script>
// ====== Config ======
const STORAGE_KEY = 'wechat_editor_config';
const LAST_PICK_KEY = 'wechat_editor_last_pick';
const DECRYPTED_KEY = 'decrypted_models';
const MANUAL_KEY = 'wechat_editor_manual';

function loadConfig() {
  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
      const cfg = JSON.parse(saved);
      document.getElementById('apiBaseUrl').value = cfg.u || '';
      document.getElementById('apiKey').value = cfg.k || '';
      document.getElementById('apiModel').value = cfg.m || '';
      document.getElementById('apiMaxTokens').value = (cfg.n && cfg.n !== 2048) ? cfg.n : 16384;
    }
  } catch(e) { console.warn('loadConfig:', e); }
}

function readMaxTokens() {
  const el = document.getElementById('apiMaxTokens');
  const n = el ? parseInt(el.value, 10) : NaN;
  return isFinite(n) && n > 0 ? n : 16384;
}

function saveConfig(url, key, model) {
  if (arguments.length > 0) {
    if (!url || !key || !model) return false;
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ u: url, k: key, m: model, t: 0.7, n: readMaxTokens() }));
    showToast('配置已保存');
    return true;
  }
  const baseUrl = document.getElementById('apiBaseUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  const modelName = document.getElementById('apiModel').value.trim();
  if (!baseUrl) { showToast('请填写 API Base URL'); return false; }
  if (!apiKey) { showToast('请填写 API Key'); return false; }
  if (!modelName) { showToast('请填写模型名称'); return false; }
  const payload = JSON.stringify({ u: baseUrl, k: apiKey, m: modelName, t: 0.7, n: readMaxTokens() });
  sessionStorage.setItem(STORAGE_KEY, payload);
  sessionStorage.setItem(MANUAL_KEY, payload);
  showToast('配置已保存');
  return true;
}

function handleSave() {
  if (saveConfig()) closeSettings();
}

function getConfig() {
  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const cfg = JSON.parse(saved);
      if (cfg.u && cfg.k && cfg.m) {
        return { baseUrl: cfg.u, apiKey: cfg.k, model: cfg.m, temperature: cfg.t || 0.7, maxTokens: (cfg.n && cfg.n !== 2048) ? cfg.n : 16384 };
      }
    } catch(e) {}
  }
  const baseUrl = document.getElementById('apiBaseUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('apiModel').value.trim();
  return { baseUrl, apiKey, model, temperature: 0.7, maxTokens: readMaxTokens() };
}

function clearConfig() {
  sessionStorage.removeItem(STORAGE_KEY);
  sessionStorage.removeItem(MANUAL_KEY);
  document.getElementById('apiBaseUrl').value = '';
  document.getElementById('apiKey').value = '';
  document.getElementById('apiModel').value = '';
  document.getElementById('apiMaxTokens').value = '';
  showToast('配置已清除');
}

function openSettings() {
  document.getElementById('apiBaseUrl').value = '';
  document.getElementById('apiKey').value = '';
  document.getElementById('apiModel').value = '';
  document.getElementById('apiMaxTokens').value = '';
  const manual = sessionStorage.getItem(MANUAL_KEY);
  if (manual) {
    try {
      const cfg = JSON.parse(manual);
      document.getElementById('apiBaseUrl').value = cfg.u || '';
      document.getElementById('apiKey').value = cfg.k || '';
      document.getElementById('apiModel').value = cfg.m || '';
      document.getElementById('apiMaxTokens').value = (cfg.n && cfg.n !== 2048) ? cfg.n : 16384;
    } catch(e) {}
  }
  document.getElementById('settingsModal').classList.add('show');
  const cached = sessionStorage.getItem(DECRYPTED_KEY);
  if (cached) {
    try {
      pickerModels = JSON.parse(cached);
      renderModelListView();
      return;
    } catch(e) {}
  }
  renderPasswordView();
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }

document.getElementById('mainInput').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

// ====== State ======
let isGenerating = false;
let abortController = null;

function cleanMarkdown(str) {
  return str.replace(/^[#*\-]+\s*/, '')
    .replace(/\*{1,2}(.*?)\*{1,2}/g, '$1')
    .replace(/__([\s\S]*?)__/g, '$1')
    .replace(/[*_]+/g, '')
    .trim();
}

function isTitleBlock(text) {
  if (!text) return false;
  if (text.endsWith('。') || text.endsWith('！') || text.endsWith('？')) return false;
  if (text.length > 120) return false;
  if (/^[0-9一二三四五六七八九十\d]+月[0-9一二三四五六七八九十\d]+日/u.test(text)) return false;
  return true;
}

function renderFormatted(text) {
  if (!text) return '<div class="placeholder">点击「生成新闻稿」开始撰写</div>';
  const blocks = text.split(/\n\n+/);
  const parts = [];
  let i = 0;
  const titleParts = [];
  while (i < blocks.length) {
    const trimmed = blocks[i].trim();
    if (!trimmed) { i++; continue; }
    if (isTitleBlock(trimmed)) {
      titleParts.push(cleanMarkdown(trimmed.replace(/\n+/g, '')));
      i++;
    } else {
      break;
    }
  }
  if (titleParts.length > 0) {
    parts.push('<h2>' + escapeHtml(titleParts.join(' ')) + '</h2>');
  }
  for (; i < blocks.length; i++) {
    const trimmed = blocks[i].trim();
    if (!trimmed) continue;
    const paragraph = cleanMarkdown(trimmed.replace(/\n+/g, ''));
    if (!paragraph) continue;
    const isSignature = /^[（(]/.test(paragraph) || /^【/.test(paragraph);
    const cls = isSignature ? ' class="signature"' : '';
    parts.push('<p' + cls + '>' + escapeHtml(paragraph) + '</p>');
  }
  return parts.join('\n');
}

const htmlEscapes = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, ch => htmlEscapes[ch]);
}

loadConfig();

document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

function normalizeChatUrl(baseUrl) {
  let u = (baseUrl || '').trim().replace(/\/+$/, '');
  if (/\/chat\/completions$/i.test(u)) return u;
  if (!/\/v\d+$/.test(u)) u += '/v1';
  return u + '/chat/completions';
}

function extractTextPart(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (Array.isArray(v)) return v.map(p => typeof p === 'string' ? p : (p && (p.text || p.content)) || '').join('');
  if (typeof v === 'object') return v.text || v.content || '';
  return '';
}

function consumeChunk(obj, state, handlers) {
  if (!obj || typeof obj !== 'object') return;
  if (Array.isArray(obj)) { obj.forEach(o => consumeChunk(o, state, handlers)); return; }
  if (obj.error) {
    const em = obj.error;
    throw new Error(typeof em === 'string' ? em : (em.message || em.msg || '模型返回错误'));
  }
  const choice = obj.choices && obj.choices[0];
  if (!choice) return;
  const node = choice.delta || choice.message || null;
  const text = (node && extractTextPart(node.content)) || extractTextPart(choice.text);
  const think = node ? (extractTextPart(node.reasoning_content) || extractTextPart(node.reasoning)) : '';
  if (choice.finish_reason) state.finishReason = choice.finish_reason;
  if (think) { state.reasoning += think; if (handlers.onThinking) handlers.onThinking(state.reasoning); }
  if (text) { state.content += text; if (handlers.onChunk) handlers.onChunk(state.content); }
}

function appendRaw(text, state, handlers) {
  if (state.content) state.content += '\n';
  state.content += text;
  if (handlers.onChunk) handlers.onChunk(state.content);
}

function processLine(raw, state, handlers, rawMode) {
  if (state.done) return;
  const t = String(raw).replace(/\r$/, '').replace(/^\uFEFF/, '').trim();
  if (!t || t.startsWith(':')) return;
  if (/^(event|id|retry)\s*:/i.test(t)) return;
  let payload = null;
  const m = t.match(/^data\s*:\s?([\s\S]*)$/i);
  if (m) payload = m[1];
  else if (t === '[DONE]') { state.done = true; return; }
  else if (t.startsWith('{') || t.startsWith('[')) payload = t;
  else if (rawMode) { appendRaw(t, state, handlers); return; }
  else return;
  payload = (payload || '').trim();
  if (!payload) return;
  if (payload === '[DONE]') { state.done = true; return; }
  let obj;
  try { obj = JSON.parse(payload); } catch (e) { if (rawMode) appendRaw(payload, state, handlers); return; }
  consumeChunk(obj, state, handlers);
}

function processWhole(text, state, handlers) {
  const t = (text || '').replace(/^\uFEFF/, '').trim();
  if (!t) return;
  try {
    const obj = JSON.parse(t);
    if (obj && (obj.choices || obj.error || Array.isArray(obj))) { consumeChunk(obj, state, handlers); return; }
  } catch (e) {}
  const rawMode = !/^\s*data\s*:/im.test(t);
  t.split('\n').forEach(l => processLine(l, state, handlers, rawMode));
}

async function callAI(config, systemPrompt, userPrompt, handlers, signal) {
  handlers = handlers || {};
  const url = normalizeChatUrl(config.baseUrl);
  const state = { content: '', reasoning: '', finishReason: null, done: false };
  const useStream = !config.compat;
  const messages = [
    { role: 'system', content: systemPrompt },
    { role: 'user', content: userPrompt }
  ];
  const variants = [
    { temperature: config.temperature !== undefined ? config.temperature : 0.7, max_tokens: config.maxTokens || 0 },
    { max_tokens: config.maxTokens || 0 },
    {}
  ];
  let resp = null, lastErr = null;
  for (let vi = 0; vi < variants.length; vi++) {
    try {
      resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': useStream ? 'text/event-stream' : 'application/json', 'Authorization': 'Bearer ' + config.apiKey },
        body: JSON.stringify({ model: config.model, messages, stream: useStream, ...variants[vi] }),
        signal
      });
    } catch (e) {
      if (signal && signal.aborted) throw e;
      throw new Error('网络请求失败（请检查跨域代理）: ' + (e.message || e));
    }
    if (resp.ok) break;
    const txt = await resp.text().catch(() => '');
    const status = resp.status;
    lastErr = new Error('HTTP ' + status + (txt ? ' - ' + txt.slice(0, 200) : ''));
    resp = null;
    if ((status === 400 || status === 422) && vi < variants.length - 1) continue;
    throw lastErr;
  }
  if (!resp) throw lastErr || new Error('请求失败');
  const ct = (resp.headers.get('content-type') || '').toLowerCase();
  if (useStream && resp.body && typeof resp.body.getReader === 'function' && ct.includes('event-stream')) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        processLine(line, state, handlers, false);
        if (state.done) break;
      }
      if (state.done) { try { reader.cancel(); } catch (e) {} break; }
    }
    buffer += decoder.decode();
    if (buffer && !state.done) processLine(buffer, state, handlers, false);
  } else {
    processWhole(await resp.text(), state, handlers);
  }
  return state;
}

// ====== Generate ======
async function generate() {
  if (isGenerating) return;

  const input = document.getElementById('mainInput').value.trim();
  if (!input) { showError('请输入新闻事实/要点'); return;   }

  const cfg = getConfig();
  if (!cfg.baseUrl || !cfg.apiKey) {
    showError('请先在左侧面板配置 API Base URL 和 API Key');
    return;
  }

  hideError();

  const systemPrompt = SYSTEM_PROMPT;

  const resultContent = document.getElementById('resultContent');
  resultContent.contentEditable = false;
  resultContent.innerHTML = '';
  resultContent.classList.remove('error');

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '生成中...';
  isGenerating = true;
  abortController = new AbortController();

  let apiUrl = cfg.baseUrl.replace(/\/+$/, '');
  if (!apiUrl.endsWith('/v1')) apiUrl += '/v1';

  try {
    const resp = await fetch(apiUrl + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + cfg.apiKey,
      },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: input },
        ],
        temperature: cfg.temperature,
        max_tokens: cfg.maxTokens,
        stream: true,
      }),
      signal: abortController.signal,
    });

    if (!resp.ok) {
      let errMsg = 'API 请求失败 (' + resp.status + ')';
      try {
        const errData = await resp.json();
        errMsg = errData.error?.message || errMsg;
      } catch(e) { console.warn('parse error response:', e); }
      throw new Error(errMsg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    let renderPending = false;
    let renderFullText = '';

    resultContent.innerHTML = '';
    resultContent.classList.remove('loading');

    function flushRender() {
      renderPending = false;
      let html = renderFormatted(renderFullText);
      const cursor = '<span class="cursor-blink">|</span>';
      const lastP = html.lastIndexOf('</p>');
      const lastH2 = html.lastIndexOf('</h2>');
      const insertAt = Math.max(lastP, lastH2);
      if (insertAt !== -1) {
        html = html.slice(0, insertAt) + cursor + html.slice(insertAt);
      } else {
        html += cursor;
      }
      resultContent.innerHTML = html;
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        let trimmed = line.trim();
        if (!trimmed || trimmed.startsWith(':')) continue;
        const dm = trimmed.match(/^data\s*:\s?(.*)$/i);
        if (dm) trimmed = dm[1].trim();
        else if (!trimmed.startsWith('{')) continue;
        if (!trimmed || trimmed === '[DONE]') continue;
        try {
          const json = JSON.parse(trimmed);
          const choice = json.choices && json.choices[0];
          const delta = choice && ((choice.delta && choice.delta.content) || (choice.message && choice.message.content));
          if (delta) {
            fullText += delta;
            renderFullText = fullText;
            if (!renderPending) {
              renderPending = true;
              requestAnimationFrame(flushRender);
            }
          }
        } catch(e) { console.warn('SSE parse:', e); }
      }
    }
    if (buffer.trim()) {
      const tail = buffer.trim().replace(/^data\s*:\s?/i, '');
      if (tail && tail !== '[DONE]') {
        try {
          const j = JSON.parse(tail);
          const c = j.choices && j.choices[0];
          const d = c && ((c.delta && c.delta.content) || (c.message && c.message.content));
          if (d) fullText += d;
        } catch(e) {}
      }
    }
    renderFullText = fullText;
    flushRender();
    if (!fullText.trim()) throw new Error('模型没有返回正文内容，请提高“最大输出 Tokens”或更换模型');

  } catch (e) {
    if (e.name === 'AbortError') {
      resultContent.innerHTML = '<div class="placeholder">已取消生成</div>';
    } else {
      showError(e.message);
      resultContent.innerHTML = '<div class="placeholder">生成失败，请重试</div>';
    }
  }

  btn.disabled = false;
  btn.textContent = '生成新闻稿';
  isGenerating = false;
  // Remove cursor and enable editing
  const cursorEl = resultContent.querySelector('.cursor-blink');
  if (cursorEl) cursorEl.remove();
  if (resultContent.querySelector('h2')) resultContent.contentEditable = true;
  abortController = null;
}

function regenerate() {
  if (!isGenerating) { generate(); return; }
  if (abortController) abortController.abort();
  const poll = setInterval(() => {
    if (!isGenerating) {
      clearInterval(poll);
      generate();
    }
  }, 30);
}

function exportDoc() {
  const el = document.getElementById('resultContent');
  const text = el.textContent;
  if (!text || text.includes('点击「生成新闻稿」开始撰写') || text.includes('正在生成')) {
    showToast('没有可导出的内容');
    return;
  }

  const title = el.querySelector('h2')?.textContent?.trim() || '新闻稿';
  const safeName = title.replace(/[<>:"/\\|?*]/g, '').substring(0, 50) || '新闻稿';

  const pStyle = 'font-family:\'FangSong\',\'仿宋\',serif;font-size:16pt;margin:0;text-align:justify;line-height:28pt;mso-line-height-rule:exactly';
  const sigStyle = 'font-family:\'FangSong\',\'仿宋\',serif;font-size:16pt;margin:0;text-align:right;text-indent:0;line-height:28pt;mso-line-height-rule:exactly';

  let bodyHtml = el.innerHTML
    // Sanitize: strip script/style/event-handler attributes before export
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/\s+on\w+\s*=\s*(?:"[^"]*"|'[^']*'|`[^`]*`)/gi, '')
    .replace('<h2>', '<h2 style="font-family:\'方正小标宋简体\',\'FZXiaoBiaoSong-B05S\',SimSun,\'宋体\',serif;font-size:18pt;text-align:center;font-weight:normal;line-height:28pt;mso-line-height-rule:exactly">')
    .replace('</h2>', '</h2><p style="' + pStyle + '">&nbsp;</p>')
    // Process signature FIRST so it doesn't get caught by generic <p> rule
    .replace(/<p class="signature">/g, '<p style="' + sigStyle + '">')
    .replace(/<p>/g, '<p style="text-indent:32pt;' + pStyle + '">');

  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>' + bodyHtml + '</body></html>';

  try {
    const blob = htmlDocx.asBlob(html, {
      margins: {
        top: 1440,
        bottom: 1440,
        left: 1800,
        right: 1800,
        header: 851,
        footer: 992,
        gutter: 0,
      },
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safeName + '.docx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Word 文档已导出');
  } catch(e) {
    showToast('导出失败：' + e.message);
  }
}

// ====== Utils ======
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// Ctrl+Enter to generate
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    generate();
  }
});

// ====== 远程收藏数据库（加密 SQLite） ======
// 数据库地址：全部同源，自动跟随当前域名 / IP / 端口 / 子目录
// 不尝试 index.html 同目录，数据库由网站专门程序在“大模型API调试与管理工具”目录更新
const getModelDbCandidates = () => {
  const base = document.baseURI;
  const list = [
    new URL('../大模型API调试与管理工具/model.db.enc', base).href,
    new URL('../大模型 API 调试与管理工具/model.db.enc', base).href,
    new URL('/大模型API调试与管理工具/model.db.enc', base).href,
    new URL('/大模型 API 调试与管理工具/model.db.enc', base).href
  ];
  return [...new Set(list)];
};
let pickerModels = [];

// ----- 解密核心 -----
async function deriveKey(password, salt, usage) {
  const enc = new TextEncoder();
  const pwKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
    pwKey,
    { name: 'AES-GCM', length: 256 },
    false,
    [usage]
  );
}

async function decryptBytes(data, password) {
  const salt = data.slice(0, 16);
  const nonce = data.slice(16, 28);
  const ciphertext = data.slice(28);
  const key = await deriveKey(password, salt, 'decrypt');
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ciphertext));
}

async function fetchModelDb() {
  const tried = [];
  for (const u of getModelDbCandidates()) {
    const url = u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) { tried.push(`${u} → HTTP ${resp.status}`); continue; }
      const ct = (resp.headers.get('content-type') || '').toLowerCase();
      if (ct.includes('text/html')) { tried.push(`${u} → 返回了 HTML 页面（路径不正确）`); continue; }
      return resp;
    } catch (e) {
      tried.push(`${u} → ${e.message || e}`);
    }
  }
  throw new Error('无法加载模型数据库，已尝试：\n' + tried.join('\n'));
}

async function loadModels(password) {
  const SQL = await initSqlJs({
    locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}`
  });
  const resp = await fetchModelDb();
  if (!resp.ok) throw new Error('无法加载远程数据库 (HTTP ' + resp.status + ')');
  const encrypted = new Uint8Array(await resp.arrayBuffer());
  const decrypted = await decryptBytes(encrypted, password);
  const db = new SQL.Database(decrypted);
  const result = db.exec('SELECT * FROM favorite_models ORDER BY platform, modelName');
  db.close();
  if (!result.length) throw new Error('数据库中没有模型数据');
  return result[0].values.map(row => ({
    id: row[0], apiId: row[1], platform: row[2] || '',
    url: row[3] || '', key: row[4] || '',
    modelName: row[5] || '', remark: row[6] || ''
  }));
}

// ----- 辅助 -----
function escHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ----- UI 控制 -----
function renderPasswordView() {
  const box = document.getElementById('pickerContent');
  box.innerHTML = `
    <div class="field">
      <label>解密密码</label>
      <input type="password" id="pwInput" placeholder="请输入数据库解密密码" autocomplete="off">
    </div>
    <p class="error" id="pickerError"></p>
    <div class="picker-actions">
      <button class="btn btn-primary" id="decryptBtn">🔓 解密并加载</button>
    </div>
  `;
  document.getElementById('decryptBtn').addEventListener('click', doDecrypt);
  document.getElementById('pwInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') doDecrypt();
  });
  document.getElementById('pwInput').focus();
}

async function doDecrypt() {
  const pw = document.getElementById('pwInput').value.trim();
  const err = document.getElementById('pickerError');
  const btn = document.getElementById('decryptBtn');
  if (!pw) { err.textContent = '请输入密码'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '解密中...';
  err.style.display = 'none';
  try {
    pickerModels = await loadModels(pw);
    sessionStorage.setItem(DECRYPTED_KEY, JSON.stringify(pickerModels));
    renderModelListView();
  } catch (e) {
    if (e.name === 'OperationError' || /password|密码|tag/i.test(e.message)) {
      err.textContent = '密码错误，请重新输入';
    } else {
      err.textContent = '解密失败：' + e.message;
    }
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '🔓 解密并加载';
  }
}

function renderModelListView() {
  const platforms = [...new Set(pickerModels.map(m => m.platform))].sort();
  const firstPlat = platforms[0] || '';
  const firstModels = pickerModels.filter(m => m.platform === firstPlat);
  const box = document.getElementById('pickerContent');
  box.innerHTML = `
    <div class="field">
      <label>平台</label>
      <select id="platSelect">
        ${platforms.map(p => `<option value="${escAttr(p)}">${escHtml(p)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>模型</label>
      <select id="modelSelect">
        ${firstModels.map(m => `<option value="${escAttr(m.modelName)}">${escHtml(m.modelName)}</option>`).join('')}
      </select>
    </div>
    <p class="error" id="pickerError"></p>
    <div class="picker-actions">
      <button class="btn btn-success" id="confirmBtn">✅ 确认使用</button>
    </div>
  `;

  document.getElementById('platSelect').addEventListener('change', function() {
    const plat = this.value;
    const filtered = pickerModels.filter(m => m.platform === plat);
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = filtered.map(m =>
      `<option value="${escAttr(m.modelName)}">${escHtml(m.modelName)}</option>`
    ).join('');
  });

  // Restore last pick
  try {
    const lastPick = JSON.parse(localStorage.getItem(LAST_PICK_KEY));
    if (lastPick && platforms.includes(lastPick.platform)) {
      document.getElementById('platSelect').value = lastPick.platform;
      document.getElementById('platSelect').dispatchEvent(new Event('change'));
      for (let i = 0; i < document.getElementById('modelSelect').options.length; i++) {
        if (document.getElementById('modelSelect').options[i].value === lastPick.modelName) {
          document.getElementById('modelSelect').value = lastPick.modelName;
          break;
        }
      }
    }
  } catch(e) {}

  document.getElementById('confirmBtn').addEventListener('click', function() {
    const plat = document.getElementById('platSelect').value;
    const modelName = document.getElementById('modelSelect').value;
    const m = pickerModels.find(x => x.platform === plat && x.modelName === modelName);
    const err = document.getElementById('pickerError');
    if (!m) { err.textContent = '请选择一个模型'; err.style.display = 'block'; return; }
    localStorage.setItem(LAST_PICK_KEY, JSON.stringify({ platform: plat, modelName: modelName }));
    saveConfig(m.url, m.key, m.modelName);
    closeSettings();
  });
}
